services:
  # L'application Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yield-ai-app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8001:8000"
    volumes:
      - .:/var/www
    # --- LA LIGNE INDISPENSABLE EST ICI ---
    command: php artisan serve --host=0.0.0.0 --port=8000
    # --------------------------------------
    networks:
      - yield-network
    depends_on:
      - db

  # La base de données MySQL
  db:
    image: mysql:8.0
    container_name: yield-ai-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: yield_ai
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - yield-network

networks:
  yield-network:
    driver: bridge

volumes:
  dbdata:
